<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MyHub Auth Redirector</title>
    <script async crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" data-clerk-publishable-key="pk_live_Y2xlcmsuaGV4bGFiOC5jb20k" data-clerk-frontend-api="accounts.hexlab8.com"></script>
    <style>
        body { background:#0F172A; color:#F8FAFC; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:20px; box-sizing:border-box; }
        .card { background:#1E293B; border-radius:12px; padding:32px; max-width:550px; width:100%; text-align:center; box-shadow:0 10px 25px rgba(0,0,0,0.5); border:1px solid #334155; }
        h2 { color:#1DB954; margin-top:0; }
        p { color:#94A3B8; font-size:14px; line-height:1.5; }
        .uid-box { background:#0F172A; border:1px solid #334155; border-radius:8px; padding:12px; font-family:monospace; font-size:13px; color:#8B5CF6; margin:16px 0; display:flex; align-items:center; justify-content:space-between; }
        .btn { background:#8B5CF6; color:white; border:none; padding:8px 16px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px; transition:background 0.2s; }
        .btn:hover { background:#7C3AED; }
        #status { color:#8B5CF6; font-family:monospace; font-size:13px; margin-top:16px; word-break:break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h2>✓ Signed In Successfully!</h2>
        <p>Transferring your authentication token to MyHub application...</p>
        
        <div id="uidContainer" style="display:none;">
            <p style="font-size:12px; color:#94A3B8; margin-bottom:4.dp;">Your Clerk User ID:</p>
            <div class="uid-box">
                <span id="userIdText">user_...</span>
                <button class="btn" onclick="copyUserId()">📋 Copy User ID</button>
            </div>
        </div>

        <div id="status">Initializing Clerk Session...</div>
    </div>

    <script>
        function updateStatus(text, isError) {
            const el = document.getElementById('status');
            if (el) {
                el.innerText = text;
                if (isError) el.style.color = '#EF4444';
            }
        }

        function copyUserId() {
            const uid = document.getElementById('userIdText').innerText;
            navigator.clipboard.writeText(uid);
            alert('User ID copied to clipboard: ' + uid);
        }

        async function initClerk() {
            try {
                if (!window.Clerk) {
                    updateStatus('Clerk JS script not found on page.', true);
                    return;
                }

                if (!window.Clerk.isReady && typeof window.Clerk.load === 'function') {
                    await window.Clerk.load({
                        publishableKey: 'pk_live_Y2xlcmsuaGV4bGFiOC5jb20k',
                        frontendApi: 'accounts.hexlab8.com'
                    });
                }

                if (window.Clerk.user || window.Clerk.session) {
                    const uid = (window.Clerk.user && window.Clerk.user.id) || (window.Clerk.session && window.Clerk.session.user && window.Clerk.session.user.id) || '';
                    const sessionId = (window.Clerk.session && window.Clerk.session.id) || '';

                    if (uid) {
                        document.getElementById('userIdText').innerText = uid;
                        document.getElementById('uidContainer').style.display = 'block';
                    }

                    updateStatus('Acquiring authentication tokens...');
                    let token = '';
                    try {
                        token = await window.Clerk.session.getToken({ template: 'turso' });
                    } catch (e) {
                        console.warn('Optional Clerk JWT token acquisition warning:', e);
                    }

                    updateStatus('Redirecting to MyHub...');
                    let redirectUrl = 'http://localhost:7789/clerk-callback?token=' + encodeURIComponent(token || 'clerk_authenticated');
                    if (sessionId) redirectUrl += '&session_id=' + encodeURIComponent(sessionId);

                    window.location.href = redirectUrl;
                } else {
                    updateStatus('No active Clerk session found. Please sign in first.', true);
                }
            } catch (e) {
                console.error('Clerk SDK error:', e);
                updateStatus('Clerk error: ' + (e.message || e.toString()), true);
            }
        }

        window.addEventListener('load', () => {
            setTimeout(initClerk, 300);
        });
    </script>
</body>
</html>
